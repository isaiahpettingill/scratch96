name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    container:
      image: node:26-bookworm
    steps:
      - name: Checkout
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git ca-certificates
          fi
          git init .
          git remote add origin https://codeberg.org/compu96/scratch96.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WRANGLER_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WRANGLER_TOKEN }}
        run: npx wrangler pages deploy dist --project-name scratch96 --branch main
